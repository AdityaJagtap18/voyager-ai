version: '3.8'

services:
  voyager-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyager-ai
    ports:
      - "8501:8501"
    environment:
      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}

      # OpenRouteService Configuration
      - ORS_API_KEY=${ORS_API_KEY}

      # Optional Agent Settings
      - AGENT_TIMEOUT=${AGENT_TIMEOUT:-300}
      - MAX_RETRIES=${MAX_RETRIES:-3}
    volumes:
      # Mount data directory to persist itineraries
      - ./data:/app/data

      # Optional: Mount .env file for development
      # - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - voyager-network

  # Phase 12 (observability): Arize Phoenix, as its own container - never
  # pip-installed into the voyager-ai service's own Python environment (see
  # requirements.txt's comment: Phoenix's dependency chain conflicts with
  # crewai's openai<3 pin and app/mcp_server.py's mcp<2 pin). Voyager talks
  # to this purely over OTLP/HTTP via PHOENIX_COLLECTOR_ENDPOINT - optional,
  # the core app starts and runs fine with this service absent or down.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: voyager-phoenix
    environment:
      # Without this, Phoenix's SQLite DB lives at /root/.phoenix inside the
      # container - NOT under the phoenix-data volume below - so traces
      # (and the admin/API-key accounts) are lost on every recreate.
      # Confirmed live: found via `phoenix.config.ENV_PHOENIX_WORKING_DIR`.
      - PHOENIX_WORKING_DIR=/mnt/data
    ports:
      - "6006:6006"  # Phoenix UI + OTLP/HTTP collector
      # No gRPC port mapping: Voyager's exporter only ever speaks OTLP/HTTP
      # (app/observability/_otlp_exporter), and host port 4317 is already
      # bound by an unrelated container on this machine.
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped
    healthcheck:
      # The official image has no curl/wget - it does ship Python, which it
      # needs to run Phoenix itself. Confirmed live: `curl`-based healthcheck
      # never left "starting" even though the server was already serving
      # 200s on /healthz; this is the same check via the interpreter that's
      # actually present in the image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - voyager-network

volumes:
  phoenix-data:

networks:
  voyager-network:
    driver: bridge
